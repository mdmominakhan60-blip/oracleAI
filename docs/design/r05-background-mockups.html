<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R05 мокапы фона — BUS-733 rev 2</title>
<style>
/* ── R03 токены (§2.1) ── */
:root {
  --color-bg: #0B0D18;
  --color-surface: #141827;
  --color-surface-raised: #1C2233;
  --color-surface-overlay: #242C3F;
  --color-text-primary: #F4F2ED;
  --color-text-secondary: #B7BDCB;
  --color-text-muted: #9AA4B8;
  --color-accent: #E9C982;
  --color-accent-hover: #F1D99F;
  --color-on-accent: #1C1820;
  --color-border: #384256;
  --color-border-control: #717B96;
  --focus-ring: 0 0 0 3px rgba(233, 201, 130, .35);
  --motion-quick: 140ms; --motion-base: 220ms; --motion-slow: 480ms;
  --ease: cubic-bezier(.22, 1, .36, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #05060c; font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; color: var(--color-text-primary); }
.mock-label { position: fixed; top: 8px; left: 12px; z-index: 99; font-size: 13px; font-weight: 700;
  background: rgba(0,0,0,.65); padding: 5px 12px; border-radius: 8px; color: var(--color-accent); letter-spacing: .3px; }
.stage { width: 100vw; height: 100vh; overflow: hidden; position: relative; }

/* ══════ ФОНОВАЯ СИСТЕМА R05 §1.1 ══════ */
.starfield {
  position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background:
    linear-gradient(180deg, rgba(10,9,22,.38) 0%, rgba(7,7,15,.8) 100%),
    url("miniapp/img/bg-cosmos.jpg") center 18% / cover no-repeat,
    radial-gradient(120% 70% at 50% -10%, #1c1a3a 0%, transparent 55%),
    radial-gradient(90% 60% at 85% 110%, #2a1440 0%, transparent 60%),
    linear-gradient(180deg, #0a0916 0%, #07070f 100%);
}
.starfield::before, .starfield::after {
  content: ""; position: absolute; left: 0; right: 0; height: 60%;
  background-image:
    radial-gradient(1.5px 1.5px at 20px 30px, rgba(255,255,255,.9), transparent),
    radial-gradient(1px 1px at 90px 80px, rgba(245,212,139,.9), transparent),
    radial-gradient(1.5px 1.5px at 160px 40px, rgba(255,255,255,.7), transparent),
    radial-gradient(1px 1px at 40px 120px, rgba(167,139,250,.9), transparent),
    radial-gradient(1.5px 1.5px at 120px 160px, rgba(255,255,255,.85), transparent),
    radial-gradient(1px 1px at 200px 100px, rgba(255,255,255,.6), transparent);
  background-size: 240px 200px;
  animation: starDrift 90s linear infinite;
  opacity: .55;
}
.starfield::after { height: 80%; opacity: .3; animation-direction: reverse; animation-duration: 140s; }
@keyframes starDrift { to { background-position: -240px 200px; } }
.galaxy { position: absolute; border-radius: 50%; filter: blur(42px);
  mix-blend-mode: screen; pointer-events: none; animation: gPulse 14s ease-in-out infinite; }
.galaxy.g1 { width: 360px; height: 240px; top: 7%; right: -90px;
  background: radial-gradient(ellipse at 45% 40%, rgba(147,197,253,.38), rgba(88,80,236,.12) 55%, transparent 76%);
  transform: rotate(-24deg); }
.galaxy.g2 { width: 300px; height: 210px; bottom: 14%; left: -80px;
  background: radial-gradient(ellipse at 50% 45%, rgba(245,212,139,.24), rgba(167,139,250,.14) 55%, transparent 78%);
  transform: rotate(18deg); animation-delay: -5s; }
.galaxy.g3 { width: 210px; height: 150px; top: 44%; right: 4%;
  background: radial-gradient(circle at 50% 50%, rgba(250,204,138,.2), rgba(167,139,250,.1) 55%, transparent 72%);
  animation-delay: -9s; }
@keyframes gPulse { 0%,100% { opacity: .32; } 50% { opacity: .62; } }
.meteor { position: fixed; z-index: -1; pointer-events: none;
  width: 140px; height: 2px; border-radius: 99px;
  background: linear-gradient(90deg, #fff 0%, rgba(255,255,255,.7) 12%, rgba(245,212,139,.35) 55%, transparent 100%);
  filter: drop-shadow(0 0 5px rgba(245,212,139,.6));
  opacity: 0; transform-origin: left center;
  animation: meteorFall var(--mdur, 7s) ease-in var(--mdelay, 0s) infinite; }
.meteor::before { content: ""; position: absolute; left: -1px; top: 50%; transform: translateY(-50%);
  width: 5px; height: 5px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 8px 2px rgba(255,255,255,.9), 0 0 18px 4px rgba(245,212,139,.5); }
.meteor.m1 { --mdur: 7s;  --mdelay: 1.2s; top: 4%;  left: 84%; --mrot: -41deg; }
.meteor.m2 { --mdur: 10s; --mdelay: 4.4s; top: 16%; left: 22%; --mrot: -34deg; }
.meteor.m3 { --mdur: 13s; --mdelay: 8.2s; top: 9%;  left: 60%; --mrot: -46deg; }
.meteor.m4 { --mdur: 9s;  --mdelay: 12.6s; top: 22%; left: 90%; --mrot: -38deg; }
@keyframes meteorFall {
  0%   { transform: translate(0,0) rotate(var(--mrot,-40deg)); opacity: 0; }
  5%   { opacity: 1; } 22% { opacity: 1; }
  30%  { opacity: 0; transform: translate(-56vw, 44vh) rotate(var(--mrot,-40deg)); }
  100% { opacity: 0; transform: translate(-56vw, 44vh) rotate(var(--mrot,-40deg)); }
}
.twinkle { position: fixed; z-index: -1; pointer-events: none; border-radius: 50%;
  background: #fff; opacity: .25; animation: twinkle 3.4s ease-in-out var(--tdelay, 0s) infinite; }
.twinkle.t1 { width: 2px; height: 2px; top: 14%; left: 12%; --tdelay: 0s; }
.twinkle.t2 { width: 2px; height: 2px; top: 30%; left: 88%; --tdelay: 1.1s; }
.twinkle.t3 { width: 2px; height: 2px; top: 52%; left: 8%;  --tdelay: 2.0s; }
.twinkle.t4 { width: 1.5px; height: 1.5px; top: 68%; left: 80%; --tdelay: .6s; }
.twinkle.polaris { width: 4px; height: 4px; top: 20%; left: 70%;
  box-shadow: 0 0 8px 1px rgba(245,212,139,.8), 0 0 20px 3px rgba(245,212,139,.35);
  animation: twinkleBig 4s ease-in-out infinite; }
@keyframes twinkle { 0%,100% { opacity: .18; transform: scale(.8); } 50% { opacity: .9; transform: scale(1.15); } }
@keyframes twinkleBig { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
.constellations { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .55; }
.constellations path { stroke: rgba(255,255,255,.15); fill: none; stroke-width: .8; stroke-dasharray: 2 3; }
.constellations circle { fill: rgba(255,255,255,.5); filter: drop-shadow(0 0 3px rgba(255,255,255,.5)); }
.lilith-sil { position: absolute; bottom: -10px; right: -26px; width: 38%; max-width: 220px;
  height: auto; opacity: .55; pointer-events: none;
  filter: drop-shadow(0 0 22px rgba(167,139,250,.3));
  transform-origin: bottom center; animation: lilBreathe 16s ease-in-out infinite; }
@keyframes lilBreathe { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: .62; transform: scale(1.012); } }

/* ══════ СОСТОЯНИЯ data-bg (R05 §1.3) ══════ */
[data-bg] .sky-dyn, [data-bg] .lilith-sil { transition: opacity var(--motion-slow) var(--ease); }
[data-bg="welcome"] .starfield { opacity: 1; }
[data-bg="chat"] .starfield { opacity: .7; }
[data-bg="tarot"] .starfield { opacity: .6; }
[data-bg="work"] .starfield { opacity: .5; }
[data-bg="chat"] .meteor, [data-bg="tarot"] .meteor, [data-bg="work"] .meteor { display: none; }
[data-bg="chat"] .lilith-sil, [data-bg="tarot"] .lilith-sil, [data-bg="work"] .lilith-sil { opacity: 0; }
[data-bg="chat"] .galaxy { opacity: .6; }
[data-bg="tarot"] .galaxy, [data-bg="work"] .galaxy { opacity: .3; animation: none; }
[data-bg="tarot"] .meteor, [data-bg="tarot"] .twinkle, [data-bg="work"] .twinkle { display: none; }
[data-bg="work"] .galaxy { display: none; }

/* пауза фона E18 */
.bg-paused .starfield::before, .bg-paused .starfield::after, .bg-paused .galaxy,
.bg-paused .meteor, .bg-paused .twinkle, .bg-paused .lilith-sil { animation: none !important; }
.bg-paused .meteor { display: none; }

/* reduced motion E23 (единый блок) */
@media (prefers-reduced-motion: reduce) {
  .starfield::before, .starfield::after, .galaxy, .nebula,
  .lilith-sil, .meteor, .twinkle, .constellations { animation: none !important; }
  .meteor { display: none; }
}

/* ══════ UI-оверлеи макетов ══════ */
.ui { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
.app-header { display: flex; align-items: center; gap: 10px; padding: 14px 18px 10px;
  background: linear-gradient(180deg, rgba(8,7,25,.78), rgba(8,7,25,.48)); }
.avatar { width: 40px; height: 40px; border-radius: 999px; object-fit: cover; border: 1px solid var(--color-border-control); }
.app-header h2 { font-size: 17px; font-weight: 700; }
.app-header .role { font-size: 12px; color: var(--color-text-secondary); }
.chat-messages { flex: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; justify-content: flex-end; }
.bubble { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.45; }
.bubble.user { align-self: flex-end; background: var(--color-surface-overlay); border: 1px solid var(--color-border); border-bottom-right-radius: 6px; }
.bubble.agent { align-self: flex-start; background: rgba(20,24,39,.92); border: 1px solid var(--color-border); border-bottom-left-radius: 6px; }
.bubble .t { display: block; margin-top: 6px; font-size: 11px; color: var(--color-text-muted); }
.composer { margin: 0 16px; padding: 10px 14px; background: var(--color-surface); border: 1px solid var(--color-border-control);
  border-radius: 24px; color: var(--color-text-muted); font-size: 15px; }
.bottom-nav { margin-top: 12px; display: flex; justify-content: space-around; padding: 10px 0 22px;
  background: linear-gradient(0deg, rgba(8,7,25,.88), rgba(8,7,25,.61)); border-top: 1px solid rgba(230,219,255,.16); }
.nav-item { font-size: 11px; color: var(--color-text-muted); text-align: center; }
.nav-item.active { color: var(--color-accent); }
.nav-item .ic { display: block; font-size: 18px; margin-bottom: 3px; }
.welcome-hero { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 30px; gap: 14px; }
.welcome-hero h1 { font-size: 32px; line-height: 40px; font-weight: 700; }
.welcome-hero p { font-size: 16px; line-height: 25px; color: var(--color-text-secondary); max-width: 30ch; }
.cta { margin-top: 8px; height: 48px; padding: 0 34px; display: inline-flex; align-items: center;
  background: linear-gradient(180deg, var(--color-accent-hover), var(--color-accent));
  color: var(--color-on-accent); border-radius: 12px; font-weight: 600; font-size: 15px; }
.tarot-felt { flex: 1; display: flex; align-items: center; justify-content: center; gap: 12px; }
.tcard { width: 92px; height: 148px; border-radius: 10px; object-fit: cover; box-shadow: var(--focus-ring), 0 14px 30px -10px rgba(0,0,0,.85); }
.tcard.facedown { background:
  radial-gradient(circle at 50% 40%, rgba(233,201,130,.25), transparent 60%),
  linear-gradient(160deg, #242C3F, #141827 60%, #1C2233);
  border: 1px solid var(--color-border); display: flex; align-items: center; justify-content: center; }
.tcard.facedown::after { content: "✦"; color: var(--color-accent); font-size: 22px; }
.tarot-q { margin: 18px; padding: 12px 16px; background: var(--color-surface); border: 1px solid var(--color-border-control); border-radius: 12px; font-size: 14px; color: var(--color-text-secondary); }
.form-wrap { flex: 1; padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; max-width: 480px; }
.field label { display: block; font-size: 13px; color: var(--color-text-secondary); margin-bottom: 6px; }
.field .inp { height: 48px; background: var(--color-surface); border: 1px solid var(--color-border-control); border-radius: 12px; padding: 0 14px; color: var(--color-text-primary); font-size: 16px; }
.profile-toggle { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px;
  background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 16px; }
.profile-toggle .cap { font-size: 15px; font-weight: 600; }
.profile-toggle .sub { font-size: 12.5px; color: var(--color-text-muted); max-width: 26ch; }
.tgl { width: 52px; height: 32px; border-radius: 999px; background: rgba(233,201,130,.25); border: 1px solid var(--color-border-control); position: relative; flex: none; }
.tgl::after { content: ""; position: absolute; top: 3px; left: 25px; width: 24px; height: 24px; border-radius: 999px;
  background: linear-gradient(180deg, var(--color-accent-hover), var(--color-accent)); }
.tgl.off { background: var(--color-surface-raised); }
.tgl.off::after { left: 3px; background: var(--color-text-muted); }
.badge-state { position: absolute; bottom: 8px; left: 12px; z-index: 99; font-size: 11px; color: var(--color-text-muted);
  background: rgba(0,0,0,.5); border-radius: 6px; padding: 3px 8px; }
/* desktop */
.desktop .starfield { background:
  linear-gradient(180deg, rgba(7,7,18,.18) 0%, rgba(7,7,18,.28) 42%, rgba(7,7,18,.76) 100%),
  url("miniapp/img/bg-cosmos-2.jpg") 58% 30% / cover no-repeat,
  radial-gradient(120% 70% at 50% -10%, #1c1a3a 0%, transparent 55%),
  linear-gradient(180deg, #0a0916 0%, #07070f 100%); }
.desktop .lilith-sil { width: 24%; max-width: 300px; right: 2%; bottom: 0; }
.desktop .shell { max-width: 760px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; }
</style>
</head>
<body>
<!-- Шаблон фона (инстанцируется JS по hash) -->
<template id="sky-tpl">
<div class="starfield" aria-hidden="true">
  <i class="meteor m1"></i><i class="meteor m2"></i><i class="meteor m3"></i><i class="meteor m4"></i>
  <i class="twinkle t1"></i><i class="twinkle t2"></i><i class="twinkle t3"></i><i class="twinkle t4"></i>
  <i class="twinkle polaris"></i>
  <span class="galaxy g1"></span><span class="galaxy g2"></span><span class="galaxy g3"></span>
  <svg class="constellations" viewBox="0 0 480 820" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <g><circle cx="40" cy="70" r="2.2"/><circle cx="72" cy="102" r="1.6"/><circle cx="104" cy="80" r="2.4"/><circle cx="134" cy="114" r="1.5"/><path d="M40,70 L72,102 L104,80 L134,114"/></g>
    <g><circle cx="348" cy="240" r="2"/><circle cx="368" cy="286" r="2.4"/><circle cx="406" cy="288" r="2.2"/><circle cx="376" cy="340" r="2"/><path d="M348,240 L368,286 L406,288"/><path d="M368,286 L340,330 M406,288 L376,340"/></g>
    <g><circle cx="60" cy="430" r="1.8"/><circle cx="96" cy="446" r="2.2"/><circle cx="128" cy="414" r="1.6"/><circle cx="150" cy="452" r="2.4"/><path d="M60,430 L96,446 L128,414 L150,452"/></g>
  </svg>
  <img class="lilith-sil" src="miniapp/img/lilith-sil.png" alt="" aria-hidden="true">
</div>
</template>

<script>
const VIEWS = {
  'welcome-m':   { bg:'welcome', label:'bg:welcome · mobile 390×844', cls:'', html: welcomeHTML() },
  'chat-m':      { bg:'chat', label:'bg:chat · mobile 390×844', cls:'', html: chatHTML() },
  'tarot-m':     { bg:'tarot', label:'bg:tarot · mobile 390×844', cls:'', html: tarotHTML() },
  'work-m':      { bg:'work', label:'bg:work · mobile 390×844', cls:'', html: workHTML() },
  'welcome-d':   { bg:'welcome', label:'bg:welcome · desktop 1440×900', cls:'desktop', html: welcomeDHTML() },
  'chat-d':      { bg:'chat', label:'bg:chat · desktop 1440×900', cls:'desktop', html: chatDHTML() },
  'tarot-d':     { bg:'tarot', label:'bg:tarot · desktop 1440×900', cls:'desktop', html: tarotDHTML() },
  'paused-m':    { bg:'welcome', label:'bg:welcome + пауза (E18) · mobile', cls:'bg-paused', html: pausedHTML() },
};
function skyHTML(){ return document.getElementById('sky-tpl').innerHTML; }
function welcomeHTML(){ return `<div class="ui">
  <div class="welcome-hero">
    <h1>Вечер добрый</h1>
    <p>Я Лилит. Спроси о любом дне — или выбери инструмент, и разберём вместе.</p>
    <span class="cta">Начать разговор</span>
    <p style="font-size:13px;color:var(--color-text-muted)">Сегодня · Луна в Близнецах</p>
  </div>
  <div class="bottom-nav">
    <span class="nav-item active"><span class="ic">💬</span>Чат</span>
    <span class="nav-item"><span class="ic">🌙</span>Сегодня</span>
    <span class="nav-item"><span class="ic">📖</span>Библиотека</span>
    <span class="nav-item"><span class="ic">✦</span>Профиль</span>
  </div></div>`; }
function welcomeDHTML(){ return `<div class="shell"><div class="ui">${welcomeHTML()}</div></div>`; }
function chatHTML(){ return `<div class="ui">
  <div class="app-header">
    <img class="avatar" src="miniapp/img/agents/oracle.jpg" alt="" aria-hidden="true">
    <div><h2>Лилит</h2><span class="role">Ваш оракул</span></div>
  </div>
  <div class="chat-messages">
    <div class="bubble user">Как проходит неделя для новых начинаний?<span class="t">19:42</span></div>
    <div class="bubble agent">Растущая Луна — время договариваться и запускать. Завтра первая четверть: решения, подписи. Могу разобрать твой конкретный план.<span class="t">19:43</span></div>
  </div>
  <div class="composer">Напиши вопрос…</div>
  <div class="bottom-nav">
    <span class="nav-item active"><span class="ic">💬</span>Чат</span>
    <span class="nav-item"><span class="ic">🌙</span>Сегодня</span>
    <span class="nav-item"><span class="ic">📖</span>Библиотека</span>
    <span class="nav-item"><span class="ic">✦</span>Профиль</span>
  </div></div>`; }
function chatDHTML(){ return `<div class="shell"><div class="ui">${chatHTML()}</div></div>`; }
function tarotHTML(){ return `<div class="ui">
  <div class="app-header">
    <img class="avatar" src="miniapp/img/agents/tarot.jpg" alt="" aria-hidden="true">
    <div><h2>Мадам Ленорман</h2><span class="role">Таролог</span></div>
  </div>
  <div class="tarot-q">Расклад «Три карты» · Влюблённость</div>
  <div class="tarot-felt">
    <img class="tcard" src="miniapp/img/tarot/wands01.jpg" alt="Колесо Фортуны">
    <div class="tcard facedown" role="img" aria-label="Закрытая карта"></div>
    <img class="tcard" src="miniapp/img/tarot/cups07.jpg" alt="Семёрка кубков">
  </div>
  <div class="composer" style="text-align:center">Переверни среднюю карту</div></div>`; }
function tarotDHTML(){ return `<div class="shell"><div class="ui">${tarotHTML()}</div></div>`; }
function workHTML(){ return `<div class="ui">
  <div class="app-header">
    <img class="avatar" src="miniapp/img/agents/astro.jpg" alt="" aria-hidden="true">
    <div><h2>Профиль · Оформление</h2></div>
  </div>
  <div class="form-wrap">
    <div class="field"><label>Город рождения</label><div class="inp">Москва</div></div>
    <div class="profile-toggle">
      <div><div class="cap">Анимация фона</div><div class="sub">Можно выключить, если движение отвлекает или тратит батарею</div></div>
      <span class="tgl" role="switch" aria-checked="true" aria-label="Анимация фона"></span>
    </div>
  </div>
  <div class="bottom-nav">
    <span class="nav-item"><span class="ic">💬</span>Чат</span>
    <span class="nav-item"><span class="ic">🌙</span>Сегодня</span>
    <span class="nav-item"><span class="ic">📖</span>Библиотека</span>
    <span class="nav-item active"><span class="ic">✦</span>Профиль</span>
  </div></div>`; }
function pausedHTML(){ return welcomeHTML(); }

const h = location.hash.slice(1) || 'welcome-m';
const v = VIEWS[h] || VIEWS['welcome-m'];
if (v.cls) document.body.classList.add(v.cls);
document.body.dataset.bg = v.bg;
const root = document.createElement('div');
root.className = 'stage';
root.innerHTML = skyHTML() + v.html + `<span class="mock-label">${v.label}</span><span class="badge-state">data-bg="${v.bg}"${v.cls ? ' · ' + v.cls : ''}</span>`;
document.body.appendChild(root);
</script>
</body>
</html>
