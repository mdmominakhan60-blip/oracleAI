name: Deploy production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/oracleAI' }}
  SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 30
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Secrets gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=""
          for v in VPS_KNOWN_HOSTS VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!v:-}" ]; then
              missing="$missing $v"
            fi
          done
          if [ -z "$missing" ]; then
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error title=VPS deploy secrets missing::Not configured in repo secrets:$missing — see docs/DEPLOYMENT.md"
            exit 1
          fi
          echo "::notice title=Auto-deploy skipped::VPS deploy secrets not configured ($missing); auto-deploy after CI stays off until they are set (docs/DEPLOYMENT.md)"

      - name: Validate Compose definition
        if: steps.gate.outputs.deploy_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp .env.production.example .env
          # Compose resolves env_file: ../.env and ${VAR:?} interpolation only via
          # --env-file when the compose file lives in a subdirectory; empty required
          # values are filled with placeholders — this step checks syntax, not secrets.
          # DATABASE_URL_ADMIN is referenced by compose as ${DATABASE_URL_ADMIN:?...}
          # but is NOT declared in .env.production.example (BUS-755: it is injected
          # only into the migrate service); without it here `compose config` aborts
          # with "must be set to an admin (DDL) PostgreSQL URL" and the whole
          # validation step fails on a template problem, not on our wiring.
          sed -i 's#^DATABASE_URL=$#DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@postgres:5432/placeholder#; s#^DATABASE_URL_ADMIN=$#DATABASE_URL_ADMIN=postgresql+asyncpg://placeholder:placeholder@postgres:5432/placeholder#; s#^POSTGRES_PASSWORD=$#POSTGRES_PASSWORD=placeholder#; s#^GRAFANA_ADMIN_PASSWORD=$#GRAFANA_ADMIN_PASSWORD=placeholder#' .env
          grep -q '^DATABASE_URL_ADMIN=' .env || echo 'DATABASE_URL_ADMIN=postgresql+asyncpg://placeholder:placeholder@postgres:5432/placeholder' >> .env
          # BUS-1520: OCI-оверрайд включается — иначе валидация пропускала
          # VPS-специфику (textfile-путь, prometheus-сеть, backup-профиль).
          docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.oci.yml config >/tmp/oracleai-compose.yml
          # BUS-1528: every app-контейнер, чей код зовёт LLM (api/bot/worker/beat),
          # должен резолвить host.docker.internal — иначе tier="lite" LLM-вызовы
          # (oracle.llm.forecast, обрабатываемые worker'ом) валипают с
          # connection refused → llm_usage ok=0. Проверяем, что extra_hosts
          # покрывает все четыре сервиса, иначе деплой не уходит.
          for svc in api bot worker beat; do
            if ! awk -v svc="$svc" '
              /^  [a-z]/ {cur=$1; sub(":$","",cur)}
              cur==svc && /^    extra_hosts:/ {found=1; exit}
            END {exit !found}' /tmp/oracleai-compose.yml; then
              echo "::error title=extra_hosts BUS-1528::сервис '$svc' не имеет extra_hosts host.docker.internal:host-gateway — LLM-канал мёртв"
              exit 1
            fi
          done
          rm -f .env
          # BUS-1534: оверрайд должен резолвиться в compose config, а не только
          # в .env. Если оверрайд (BACKUP_REQUIRE_OFFSITE=0, пустые S3-переменные)
          # не попал в резолв — wiring сломан (deploy-скрипт не подключает -f
          # oci.yml), и прод может вернуться к =1 без S3/R2 → backup упадёт.
          # Проверяем на том же резолве, что и extra_hosts выше.
          for kv in 'BACKUP_REQUIRE_OFFSITE: "0"' 'BACKUP_S3_URL: ""' \
                    'BACKUP_S3_ACCESS_KEY: ""' 'BACKUP_S3_SECRET_KEY: ""' \
                    'BACKUP_S3_BUCKET: ""'; do
            if ! grep -qF "$kv" /tmp/oracleai-compose.yml; then
              echo "::error title=compose-override BUS-1534::в резолве compose нет '$kv' — оверрайд не применяется на VPS"
              exit 1
            fi
          done
          # BUS-1534: единый чекер compose-оверрайдов (static/wiring/env/repo).
          # Статика уже резолвилась выше; чекер повторяет её независимо и
          # добавляет проверки, которые не ловит grep-проба: wiring (оба
          # deploy-скрипта подключают -f oci.yml), repo-file/repo-sync (checkout
          # не на коммите старше 4b45cf6 и не на detached-HEAD в сторону дрейфа).
          # CHECK_REPO=. — чекер должен проверять ТОТ checkout, в котором
          # запускается workflow (actions/checkout), а не разработчика.
          CHECK_REPO="$GITHUB_WORKSPACE" python3 scripts/check_compose_overrides.py

      - name: Prepare SSH trust
        if: steps.gate.outputs.deploy_enabled == 'true'
        shell: bash
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy and verify on VPS
        if: steps.gate.outputs.deploy_enabled == 'true'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          key_file="$RUNNER_TEMP/oracleai-deploy-key"
          printf '%s\n' "$VPS_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"

          ssh -i "$key_file" -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          # Приватный репо: клон/fetch только по SSH через read-only deploy key,
          # установленный на VPS (~deploy/.ssh/config → IdentityFile).
          REPO_URL="git@github.com:mdmominakhan60-blip/oracleAI.git"
          # BUS-1534: OCI-оверрайд (VPS-специфика: textfile-путь,
          # prometheus-сеть, backup-профиль, OVERRIDE BACKUP_REQUIRE_OFFSITE=0)
          # подключается явно — без него `docker compose config` резолвит
          # ПК-путь /home/softis/.../textfile, которого на VPS нет, и
          # node-exporter не скрейпит бэкап-метрики. Ранее (BUS-1520) тут был
          # один -f docker-compose.yml — оверрайд никогда не применялся, и
          # прод-контейнер брал BACKUP_REQUIRE_OFFSITE из .env (тогда =0, но
          # при следующем оверрайде, заданном только в compose, прод мог
          # вернуться к =1 без S3/R2 → backup-postgres.sh упадёт).
          # Массив: quoted "infra/... -f infra/..." ушёл бы в один аргумент.
          COMPOSE_ARGS=("-f" "infra/docker-compose.yml" "-f" "infra/docker-compose.oci.yml")
          PREVIOUS_SHA=""

          rollback() {
            echo "Deployment failed; attempting rollback to ${PREVIOUS_SHA:-none}" >&2
            if [ -n "$PREVIOUS_SHA" ]; then
              git checkout --detach "$PREVIOUS_SHA" || true
              docker compose --env-file .env -f "${COMPOSE_ARGS[@]}" up -d --build --remove-orphans || true
            fi
          }
          trap rollback ERR

          if [ ! -d "$APP_DIR/.git" ]; then
            install -d -m 755 "$(dirname "$APP_DIR")"
            git clone "$REPO_URL" "$APP_DIR"
          fi

          cd "$APP_DIR"
          PREVIOUS_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
          git fetch --prune origin master
          git fetch origin "$DEPLOY_SHA"
          git checkout --detach "$DEPLOY_SHA"

          test -f .env || {
            echo "Missing $APP_DIR/.env. Create it from .env.production.example before the first deploy." >&2
            exit 1
          }

          docker compose --env-file .env -f "${COMPOSE_ARGS[@]}" config >/tmp/oracleai-compose-resolved.yml
          docker compose --env-file .env -f "${COMPOSE_ARGS[@]}" pull --ignore-pull-failures
          docker compose --env-file .env -f "${COMPOSE_ARGS[@]}" up -d --build --remove-orphans

          for attempt in $(seq 1 36); do
            if docker compose --env-file .env -f "${COMPOSE_ARGS[@]}" exec -T api curl -fsS http://127.0.0.1:8080/api/health >/tmp/oracleai-health.json; then
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              docker compose --env-file .env -f "${COMPOSE_ARGS[@]}" ps
              docker compose --env-file .env -f "${COMPOSE_ARGS[@]}" logs --no-color --tail=120 api migrate worker beat caddy
              exit 1
            fi
            sleep 5
          done

          grep -q '"ok"[[:space:]]*:[[:space:]]*true' /tmp/oracleai-health.json
          docker compose --env-file .env -f "${COMPOSE_ARGS[@]}" ps
          docker image prune -f
          trap - ERR
          echo "Deployment ${DEPLOY_SHA} is healthy"
          REMOTE
