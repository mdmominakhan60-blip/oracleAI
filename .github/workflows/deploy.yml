name: Deploy production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/oracleAI' }}
  SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 30
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Validate Compose definition
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose -f infra/docker-compose.yml config >/tmp/oracleai-compose.yml
          rm -f .env

      - name: Prepare SSH trust
        shell: bash
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy and verify on VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          key_file="$RUNNER_TEMP/oracleai-deploy-key"
          printf '%s\n' "$VPS_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"

          ssh -i "$key_file" -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          REPO_URL="https://github.com/astartv1ai-del/oracleAI.git"
          COMPOSE_FILE="infra/docker-compose.yml"
          PREVIOUS_SHA=""

          rollback() {
            echo "Deployment failed; attempting rollback to ${PREVIOUS_SHA:-none}" >&2
            if [ -n "$PREVIOUS_SHA" ]; then
              git checkout --detach "$PREVIOUS_SHA" || true
              docker compose -f "$COMPOSE_FILE" up -d --build --remove-orphans || true
            fi
          }
          trap rollback ERR

          if [ ! -d "$APP_DIR/.git" ]; then
            install -d -m 755 "$(dirname "$APP_DIR")"
            git clone "$REPO_URL" "$APP_DIR"
          fi

          cd "$APP_DIR"
          PREVIOUS_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
          git fetch --prune origin master
          git fetch origin "$DEPLOY_SHA"
          git checkout --detach "$DEPLOY_SHA"

          test -f .env || {
            echo "Missing $APP_DIR/.env. Create it from .env.production.example before the first deploy." >&2
            exit 1
          }

          docker compose -f "$COMPOSE_FILE" config >/tmp/oracleai-compose-resolved.yml
          docker compose -f "$COMPOSE_FILE" pull --ignore-pull-failures
          docker compose -f "$COMPOSE_FILE" up -d --build --remove-orphans

          for attempt in $(seq 1 36); do
            if docker compose -f "$COMPOSE_FILE" exec -T api curl -fsS http://127.0.0.1:8080/api/health >/tmp/oracleai-health.json; then
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              docker compose -f "$COMPOSE_FILE" ps
              docker compose -f "$COMPOSE_FILE" logs --no-color --tail=120 api migrate worker beat caddy
              exit 1
            fi
            sleep 5
          done

          grep -q '"ok"[[:space:]]*:[[:space:]]*true' /tmp/oracleai-health.json
          docker compose -f "$COMPOSE_FILE" ps
          docker image prune -f
          trap - ERR
          echo "Deployment ${DEPLOY_SHA} is healthy"
          REMOTE
