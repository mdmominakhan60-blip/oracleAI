# BUS-488 (follow-up BUS-469): systemd-oomd мониторинг агентской нагрузки.
#
# До фикса oomctl показывал ПУСТЫЕ "Swap/Memory Pressure Monitored CGroups" —
# oomd физически не имел целей для kill, все 7+ hard-крашей (BUS-428) проходили
# незамеченными. ManagedOOM*=auto (default) = "не мониторить", пока свойство
# явно не выставлено на cgroup.
#
# ВАЖНО (верифицировано kill-тестом 2026-09-08, см. BUS-488/BUS-469):
# - Drop-in /etc/systemd/system/user@1000.service.d/oomd.conf НЕ делает
#   user@1000.service мониторимым: systemd-oomd пропускает delegated cgroup
#   (Delegate=yes у user@.service). oomctl его не показывает.
# - Рабочий путь — свойства ВНУТРИ user-менеджера, персистентно:
#     systemctl --user set-property paperclip.service ManagedOOMMemoryPressure=kill
#     systemctl --user set-property paperclip.service ManagedOOMMemoryPressureLimit=30%
#     systemctl --user set-property paperclip.service ManagedOOMSwap=kill
#   → создаёт ~/.config/systemd/user.control/paperclip.service.d/50-*.conf
#   без root и без рестарта (oomd подхватывает по PropertiesChanged, проверять
#   `oomctl` — paperclip.service должен появиться в обоих списках).
#
# Параметры (согласовано в BUS-488, основано на BUS-469 RCA v3):
# - MemoryPressureLimit=30% на PSI some, окно Default Memory Pressure Duration
#   (30s, см. oomctl). Краш-паттерн 18:15–18:24 07-09 давал PSI some 73%;
#   калибровочный тест: при пороге 50% давление ~21% не триггерит, т.е. 30%
#   не ловит короткие всплески (make test), но ловит краш-паттерн с запасом.
# - Swap=kill: anon-thrash (si/so десятки тысяч стр/с при 2.6G free) —
#   второй канал срабатывания; SwapUsedLimit=90% (default) в oomctl.
#
# Контрольный тест kill-пути (PASSED, 12 с до kill):
#   systemd-run --user --unit=oomd488c -p ManagedOOMMemoryPressure=kill \
#     -p ManagedOOMMemoryPressureLimit=10% -p ManagedOOMMemoryPressureDurationSec=5s \
#     -p MemoryMax=400M -p RuntimeMaxSec=120 /usr/bin/python3 stress_mem.py
#   → journal: "Marked .../oomd488c.service for killing due to memory pressure
#     being 24.59% > 10.00% for > 5s with reclaim activity"; Result=oom-kill.
#
# Ограничение: под защитой только явно помеченные юниты user-сессии
# (paperclip.service). system.slice (omniroute) НЕ мониторится — для него
# нужен `systemctl set-property` на system-уровне (root, отдельное согласование).
#
# Применение этого файла НЕ требуется (документация намерения). Если когда-нибудь
# появится недelegated сценарий: sudo cp в /etc/systemd/system/user@1000.service.d/
# + daemon-reload.
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=30%
ManagedOOMSwap=kill
