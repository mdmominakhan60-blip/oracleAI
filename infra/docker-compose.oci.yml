# OCI VPS override для прода oracleAI — BUS-704 (план BUS-642 r2, фаза 1, drift-фиксы D1–D2).
# База: infra/docker-compose.yml. Применение на VPS:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.oci.yml up -d
#
# D1: прод-стек больше не требует external-сеть staging (oracle_staging_internal).
#     На ПК сеть существовала физически (staging-стек), на чистом VPS её нет —
#     прод не стартовал бы. Staging на VPS (r2 §4) — изолированный проект,
#     скрейп staging подключается отдельным override после G1 (план r2 §5 фаза 1).
#
# D2: host.docker.internal:host-gateway на prometheus остаётся безвредным
#     (host-gateway = сам VPS), но скрейп-таргеты omniroute/ПК в конфиге нет —
#     override-файл задаёт extra_hosts явно пустым, чтобы resolved-конфиг VPS
#     не зависел от ПК-специфики BUS-270.
#
# D3 (LLM-канал a_tunnel): ssh-туннель ПК->VPS биндит omniroute на loopback VPS
#     (127.0.0.1:20128), контейнеры его не видят. Bridge oracleai-llm-bridge
#     (user-systemd на VPS, ~/.local/bin/oracleai-llm-bridge.py) слушает
#     172.17.0.1:20128 и 172.18.0.1:20128 (docker0 + gateway oracle_internal).
#     host.docker.internal:host-gateway у api/bot резолвит в 172.17.0.1 —
#     цепочка контейнер -> host -> INPUT(fw-ACCEPT docker-подсетей:20128) ->
#     bridge -> tunnel -> ПК-omniroute. OCI-дефолтный INPUT REJECT (icmp-host-
#     prohibited) режет host-порты кроме 22/80/443 — обход через fw-скрипт
#     ~/.local/bin/oracleai-llm-bridge-fw.sh (docker-privileged, idempotent,
#     вставляет ACCEPT перед REJECT; без sudo на VPS иначе не поставить).
#     В .env VPS: CUSTOM_LLM_BASE_URL=http://host.docker.internal:20128/v1
#     Верифицировано 2026-09-10 00:55Z: chat-вызов из infra-api-1 через
#     host.docker.internal -> 200 OK за 2.1s (oc/claude-sonnet-5).
#
# BUS-833 (бэкап-цикл прода, SLO D4):
#  - node-exporter: textfile-коллектор перепривязан на VPS-каталог
#    /var/lib/oracleai/textfile (базовый compose указывает ПК-путь
#    engineering-platform — на VPS его нет). Пишет backup-metrics.sh
#    (systemd --user oracleai-backup-metrics.timer на VPS).
#  - backup: включён профиль backup с VPS-путями (см. ниже) — pg_dump -Fc
#    (custom = zlib-6 в PG16), шифрование AES-256-CBC ключом
#    /etc/oracle/backup.key (создан BUS-84, хэш отличен от ПК-ключа —
#    сверено sha256 2026-09-10), retention 14, статус backup-status.json.
#    Требование -Z 6 выполняется по умолчанию: custom-формат жмёт zlib-6
#    (флаг --compress=6 задан явно для прозрачности).
services:
  prometheus:
    networks: !override
      - oracle_internal
    extra_hosts: !override []
  api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
  bot:
    extra_hosts:
      - "host.docker.internal:host-gateway"
  node-exporter:
    volumes: !override
      - /:/host:ro,rslave
      - /var/lib/oracleai/textfile:/textfile:ro
  backup:
    profiles: ["backup"]
    environment:
      # BUS-833: offsite D4 отложен по решению карточки 4ac3cd86 (answered 2026-10-08T19:57Z,
      # ответ "later" — работаем без offsite). R2-токен не создаётся через CF API (проба
      # 9109 Unauthorized, только CF dash = действие человека), владелец не передавал
      # ключи с 10.09. ОVERRIDE-ом задаём 0, чтобы VPS-прод не требовал S3-обвязку,
      # несмотря на BACKUP_REQUIRE_OFFSITE=1 в .env (там она для ПК-стека с MinIO).
      # Риск: без offsite прод остаётся с единственной копией данных (volumes VPS) —
      # это зафиксированный остаточный риск, а не закрытый DoD (см. BUS-833).
      BACKUP_REQUIRE_OFFSITE: "0"
      # S3/R2-vygruzka otkljuchena (sm. vyshe). Peremennye ostavljajutsja pustymi namerno:
      # backup-postgres.sh:20 smotrit na ich nalichie i pri BACKUP_REQUIRE_OFFSITE=0
      # offsite-vetku ne aktiviruet. Pustye znaceniya ne lomat pgdump/shifrovanie.
      BACKUP_S3_URL: ""
      BACKUP_S3_ACCESS_KEY: ""
      BACKUP_S3_SECRET_KEY: ""
      BACKUP_S3_BUCKET: ""
    volumes: !override
      - /srv/oracle/backups:/backups
      - /etc/oracle/backup.key:/run/secrets/oracle-backup-key:ro
      - ./backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
