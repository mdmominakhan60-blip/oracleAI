groups:
- name: paperclip-systemic-failures
  rules:
  - alert: PaperclipSystemicFailRateHigh
    expr: paperclip_fail_rate_hourly{cls="S*"} > 20
    for: 2m
    labels:
      severity: critical
      stack: oracleai
    annotations:
      summary: 'Paperclip S* фейлы: {{ $value | printf "%.0f" }} в час'
      description: 'Системные классы S1+S3+S4 — нестабильность хоста.

        S1={{ query "paperclip_fail_rate_hourly{cls=\"S1\"}" }},

        S3={{ query "paperclip_fail_rate_hourly{cls=\"S3\"}" }},

        S4={{ query "paperclip_fail_rate_hourly{cls=\"S4\"}" }}.

        Проверить: ребуты (journalctl --since 2h -k | grep -i reboot),

        PSI memory (cat /proc/pressure/memory), swap (free -h),

        рестарты paperclip.service.

        '
  - alert: PaperclipRestartsHigh
    expr: paperclip_restarts_last_hour > 5
    for: 1m
    labels:
      severity: warning
      stack: oracleai
    annotations:
      summary: 'paperclip.service рестартов: {{ $value | printf "%.0f" }}/час'
      description: 'Частые рестарты control-plane убивают всех активных claude-детей.

        Проверить: journalctl --user -u paperclip --since 30m | grep -E ''Started|Stopped|error''.

        Если это planned deploy — использовать safe-stop unit.

        Если crash-loop — StartLimitBurst сработал, посмотреть why.

        '
  - alert: PaperclipPSIMemoryFullHigh
    expr: rate(node_pressure_memory_stalled_seconds_total[2m]) * 100 > 20
    for: 3m
    labels:
      severity: warning
      stack: oracleai
    annotations:
      summary: PSI memory full >20 sustained — хост забит
      description: 'Производная stalled_seconds >20% за 2 мин = давление не отпускает.

        Первое действие: pgrep -fc ''/.local/bin/claude''; free -h; swapon --show.

        Крайняя мера: systemctl --user restart paperclip.service (убивает раны).

        '
- name: oracleai-host-resources
  rules:
  - alert: OracleAISwapHigh
    expr: (1 - (node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes)) * 100 > 70
    for: 5m
    labels:
      severity: warning
      stack: oracleai
    annotations:
      summary: 'Swap usage high: {{ $value | printf "%.0f" }}%'
      description: Swap >70% (clear 60%). Проверить claude-дети и своп-потребителей.
  - alert: OracleAILoadHigh
    expr: node_load1 > 20
    for: 5m
    labels:
      severity: warning
      stack: oracleai
    annotations:
      summary: 'Host load1 high: {{ $value | printf "%.1f" }}'
      description: Load1 >20. claude-раны гаснут сами при cgroup-лимитах.
  - alert: OracleAIMemPressureHigh
    expr: rate(node_pressure_memory_waiting_seconds_total[2m]) * 100 > 50
    for: 3m
    labels:
      severity: warning
      stack: oracleai
    annotations:
      summary: Memory PSI some >50% sustained
      description: Память давится. Проверить swap, claude-дети, Memory.events cgroup paperclip.
  - alert: OracleAIOmnirouteDown
    expr: up{job="oracleai-api"} == 0
    for: 3m
    labels:
      severity: critical
      stack: oracleai
    annotations:
      summary: OracleAI API (omniroute proxy) недоступен
      description: Проверить docker ps | grep omniroute, БД db_ainft_api_prod.
- name: oracleai-availability
  rules:
  - alert: OracleAIObservabilityTargetDown
    expr: up{job=~"prometheus|cadvisor|alloy|oracleai-api|oracleai-bot|oracleai-staging-api|oracleai-staging-bot"} == 0
    for: 2m
    labels:
      severity: critical
      stack: oracleai
    annotations:
      summary: Observability target is down
      description: Prometheus target {{ $labels.job }} has been down for more than 2 minutes.
  - alert: OracleAIContainerRestarting
    expr: changes(container_start_time_seconds{name=~"infra-.*"}[10m]) > 2
    for: 5m
    labels:
      severity: warning
      stack: oracleai
    annotations:
      summary: OracleAI container is restarting
      description: Container {{ $labels.name }} restarted repeatedly during the last 10 minutes.
  - alert: OracleAIContainerMemoryHigh
    expr: (container_memory_working_set_bytes{name=~"infra-.*"} / container_spec_memory_limit_bytes{name=~"infra-.*"}) > 0.90
      and container_spec_memory_limit_bytes{name=~"infra-.*"} > 0
    for: 10m
    labels:
      severity: warning
      stack: oracleai
    annotations:
      summary: OracleAI container memory is high
      description: Container {{ $labels.name }} uses more than 90% of its memory limit.
  - alert: OracleAIDiskSpaceLow
    expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
    for: 10m
    labels:
      severity: warning
      stack: oracleai
    annotations:
      summary: VPS disk space is low
      description: Less than 15% of root filesystem space remains.
- name: oracleai-beta-health
  rules:
  - alert: OracleAI5xxBurst
    expr: increase(oracleai_http_requests_total{status=~"5.."}[5m]) > 5
    for: 1m
    labels:
      severity: critical
      stack: oracleai
    annotations:
      summary: '5xx burst: {{ $value | printf "%.0f" }} server errors in 5m'
      description: 'Маршрут {{ $labels.route }} отвечает 5xx. Первое действие: docker logs infra-api-1 --since 10m | grep
        -E ''ERROR|Traceback''.'
  - alert: OracleAIRateLimitFailClosed
    expr: increase(oracleai_http_requests_total{status="429",route=~"api.*"}[5m]) > 20
    for: 2m
    labels:
      severity: critical
      stack: oracleai
    annotations:
      summary: Массовые 429 — вероятно rate-limit fail-closed (backend недоступен)
      description: 'Первое действие: проверить Redis (docker logs infra-redis-1; docker exec infra-api-1 env | grep REDIS_URL)
        и лог ''rate_limit_denied backend=''. При backend=redis-недоступен → fail-closed роняет ВСЕ запросы.'
  - alert: OracleAILLMFailureRateHigh
    expr: (sum(increase(oracleai_llm_usage_total{ok="0"}[10m])) / clamp_min(sum(increase(oracleai_llm_usage_total[10m])),
      1)) > 0.5 and sum(increase(oracleai_llm_usage_total[10m])) > 3
    for: 5m
    labels:
      severity: warning
      stack: oracleai
    annotations:
      summary: 'LLM-канал деградировал: >50% ok=0 в llm_usage за 10m'
      description: 'Первое действие: curl http://<host-gateway>:20128/healthz (omniroute) и docker logs infra-worker-1 | grep
        -i llm. Продукт при этом деградирует в офлайн-ответы (runtime.py:175).'
- name: oracleai-replay-store
  rules:
  - alert: OracleAIReplayStoreFailOpen
    expr: increase(oracleai_replay_store_total{result="open"}[10m]) > 0
    for: 0m
    labels:
      severity: warning
      stack: oracleai
    annotations:
      summary: 'Replay-store недоступен: минт сессии идёт fail-open'
      description: 'Redis-ошибка в POST /api/auth/session (auth_router.py, auth_replay_store_down fail-open). Replay-защита
        на минте не работает до восстановления Redis. Первое действие: docker logs infra-api-1 --since 10m | grep auth_replay_store_down;
        проверить контейнер redis (docker ps | grep redis, docker logs infra-redis-1).'
  - alert: OracleAIReplayStoreFailClosed
    expr: increase(oracleai_replay_store_total{result="closed"}[10m]) > 0
    for: 0m
    labels:
      severity: critical
      stack: oracleai
    annotations:
      summary: 'Replay-store fail-closed: минт сессии отклоняется (503) при недоступном Redis'
      description: 'REPLAY_FAIL_CLOSED=1 и Redis недоступен — новые сессии не выдаются (POST /api/auth/session → 503 auth
        store unavailable). Первое действие: восстановить redis (docker start infra-redis-1) либо согласовать снятие флага.
        Лог: docker logs infra-api-1 --since 10m | grep ''fail-closed''.'
