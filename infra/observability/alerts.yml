groups:
  - name: oracleai-availability
    rules:
      - alert: OracleAIObservabilityTargetDown
        expr: up{job=~"prometheus|cadvisor|alloy|oracleai-api|oracleai-bot|oracleai-staging-api|oracleai-staging-bot"} == 0
        for: 2m
        labels:
          severity: critical
          stack: oracleai
        annotations:
          summary: "Observability target is down"
          description: "Prometheus target {{ $labels.job }} has been down for more than 2 minutes."

      - alert: OracleAIContainerRestarting
        expr: changes(container_start_time_seconds{name=~"infra-.*"}[10m]) > 2
        for: 5m
        labels:
          severity: warning
          stack: oracleai
        annotations:
          summary: "OracleAI container is restarting"
          description: "Container {{ $labels.name }} restarted repeatedly during the last 10 minutes."

      - alert: OracleAIContainerMemoryHigh
        expr: (container_memory_working_set_bytes{name=~"infra-.*"} / container_spec_memory_limit_bytes{name=~"infra-.*"}) > 0.90 and container_spec_memory_limit_bytes{name=~"infra-.*"} > 0
        for: 10m
        labels:
          severity: warning
          stack: oracleai
        annotations:
          summary: "OracleAI container memory is high"
          description: "Container {{ $labels.name }} uses more than 90% of its memory limit."

      - alert: OracleAIDiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 10m
        labels:
          severity: warning
          stack: oracleai
        annotations:
          summary: "VPS disk space is low"
          description: "Less than 15% of root filesystem space remains."

# ── BUS-270: базовые алерты бета-наблюдаемости ──
# Порог 5xx-бurst согласован: >5 ошибок за 5 минут — ранний сигнал при бета-трафике
# (даёт 1-2 ложных срабатывания в неделю на фоновых ботоходах; ложный позитив дешевле
# пропущенного инцидента). Канал доставки — Prometheus → → Alertmanager добавляется
# в BUS-270-2; до тех пор выгрузка алертов — scripts/metrics-snapshot.sh + review on-call.
  - name: oracleai-beta-health
    rules:
      # 1) 5xx burst: >5 серверных ошибок суммарно за 5 минут.
      - alert: OracleAI5xxBurst
        expr: increase(oracleai_http_requests_total{status=~"5.."}[5m]) > 5
        for: 1m
        labels:
          severity: critical
          stack: oracleai
        annotations:
          summary: "5xx burst: {{ $value | printf \"%.0f\" }} server errors in 5m"
          description: "Маршрут {{ $labels.route }} отвечает 5xx. Первое действие: docker logs infra-api-1 --since 10m | grep -E 'ERROR|Traceback'."

      # 2) Rate-limit fail-closed: 429 при недоступном backend'е лимитера.
      # RATE_LIMIT_FAIL_CLOSED=1 роняет лимитер → все ответы 429 (deps.py:88-98);
      # backend="unknown"/degraded отличает fail-closed от честного 429 per-user.
      - alert: OracleAIRateLimitFailClosed
        expr: increase(oracleai_http_requests_total{status="429",route=~"api.*"}[5m]) > 20
        for: 2m
        labels:
          severity: critical
          stack: oracleai
        annotations:
          summary: "Массовые 429 — вероятно rate-limit fail-closed (backend недоступен)"
          description: "Первое действие: проверить Redis (docker logs infra-redis-1; docker exec infra-api-1 env | grep REDIS_URL) и лог 'rate_limit_denied backend='. При backend=redis-недоступен → fail-closed роняет ВСЕ запросы."

      # 3) Доля ok=0 в llm_usage: деградация LLM-канала (записывает record_usage,
      # app/core/llm.py:198-231). Экспортируется api /metrics кастомным счётчиком
      # oracleai_llm_usage_total{ok="0|1"} (BUS-270, метрика добавляется рядом).
      # Алерт: в 10-минутном окне были вызовы и >50% неуспешны — канал фактически лежит.
      - alert: OracleAILLMFailureRateHigh
        expr: (sum(increase(oracleai_llm_usage_total{ok="0"}[10m])) / clamp_min(sum(increase(oracleai_llm_usage_total[10m])), 1)) > 0.5 and sum(increase(oracleai_llm_usage_total[10m])) > 3
        for: 5m
        labels:
          severity: warning
          stack: oracleai
        annotations:
          summary: "LLM-канал деградировал: >50% ok=0 в llm_usage за 10m"
          description: "Первое действие: curl http://<host-gateway>:20128/healthz (omniroute) и docker logs infra-worker-1 | grep -i llm. Продукт при этом деградирует в офлайн-ответы (runtime.py:175)."

# ── BUS-343: видимость сбоя replay-store (BUS-342 условие) ──
# Решение EL по BUS-342: fail-open на проде допустим только при наблюдаемости
# инцидента. Счётчик oracleai_replay_store_total{result="open|closed"} пишет
# auth_router._mark_init_data_used только в exception-ветке (сбой Redis на
# минте) — нулевой ряд = норма, любой рост = инцидент.
  - name: oracleai-replay-store
    rules:
      # 1) Fail-open: Redis был недоступен, минт прошёл без replay-брони.
      # Украденная initData в это окно может отминтиться повторно (до 24ч жизни
      # подписи). severity=warning: доступность не пострадала, но replay-защита
      # была немой.
      - alert: OracleAIReplayStoreFailOpen
        expr: increase(oracleai_replay_store_total{result="open"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
          stack: oracleai
        annotations:
          summary: "Replay-store недоступен: минт сессии идёт fail-open"
          description: "Redis-ошибка в POST /api/auth/session (auth_router.py, auth_replay_store_down fail-open). Replay-защита на минте не работает до восстановления Redis. Первое действие: docker logs infra-api-1 --since 10m | grep auth_replay_store_down; проверить контейнер redis (docker ps | grep redis, docker logs infra-redis-1)."

      # 2) Fail-closed (REPLAY_FAIL_CLOSED=1): Redis недоступен → минт полностью
      # лежит (503 auth store unavailable на каждую попытку). Отказ авторизации
      # для новых сессий — критичнее fail-open. Ветка result="closed"
      # инкрементится только при включённом REPLAY_FAIL_CLOSED=1 (условие внутри
      # if в коде), поэтому счётчик сам является индикатором режима: честные
      # replay-отказы (401) инкремента не дают и ложного срабатывания не
      # устроит. 503 вместо 401 — BUS-344: «replay» при живой initData вводит
      # в заблуждение при диагностике; клиент miniapp любой не-2xx обрабатывает
      # одинаково.
      - alert: OracleAIReplayStoreFailClosed
        expr: increase(oracleai_replay_store_total{result="closed"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
          stack: oracleai
        annotations:
          summary: "Replay-store fail-closed: минт сессии отклоняется (503) при недоступном Redis"
          description: "REPLAY_FAIL_CLOSED=1 и Redis недоступен — новые сессии не выдаются (POST /api/auth/session → 503 auth store unavailable). Первое действие: восстановить redis (docker start infra-redis-1) либо согласовать снятие флага. Лог: docker logs infra-api-1 --since 10m | grep 'fail-closed'."
