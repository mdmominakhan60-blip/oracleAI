global:
  resolve_timeout: 5m
  http_config: {}

# Единый receiver: Telegram канал оператора.
# ВНИМАНИЕ: реальный конфиг генерирует alertmanager-entrypoint.sh из env при
# старте контейнера — этот файл только справочный шаблон.
# BUS-855: chat_id = ALERT_CHAT_ID (группа операторов, отрицательный id),
# задан ОБЯЗАТЕЛЬНО — fallback на ADMIN_ID убран (identity владельца ≠ канал
# алертов, см. BUS-851). Если нужен отдельный бот — ALERT_BOT_TOKEN в .env.
route:
  receiver: telegram-operator
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram-operator
    telegram_configs:
      - bot_token: ${ALERT_BOT_TOKEN:-${BOT_TOKEN}}
        chat_id: ${ALERT_CHAT_ID:-${ADMIN_ID}}
        parse_mode: HTML
        message: |
          <b>{{ .CommonLabels.alertname }}</b>
          {{ range .Alerts }}
            {{- if .Labels.severity }}<i>{{ .Labels.severity }}</i>{{ end }}
            {{- if .Annotations.summary }}
              {{ .Annotations.summary }}
            {{- end }}
            {{- if .Annotations.description }}
              {{ .Annotations.description }}
            {{- end }}
            {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
          {{ end }}

# inhibit: critical тонет warning по тому же job (защита от alert-storm)
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["job"]
