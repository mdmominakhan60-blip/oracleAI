global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: oracleai

# BUS-302: алерты через alertmanager → Telegram
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml
  # BUS-833: алерты бэкап-цикла прода (SLO D4, offsite) — файл
  # infra/observability/backup-alerts.yml монтируется рядом (см. docker-compose.yml).
  - /etc/prometheus/backup-alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: oracleai-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
    scrape_interval: 30s
    scrape_timeout: 5s

  # BUS-302: бот экспортирует свой реестр prometheus_client на 9101
  # (start_http_server в app/bot/main.py). Сюда попадают llm-каунтеры
  # scheduler-гороскопов/forecast-ов — иначе OracleAILLMFailureRateHigh слеп.
  - job_name: oracleai-bot
    metrics_path: /metrics
    static_configs:
      - targets: ["bot:9101"]
    scrape_interval: 30s
    scrape_timeout: 5s

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]


