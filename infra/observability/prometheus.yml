global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: oracleai

# BUS-302: алерты через alertmanager → Telegram
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: oracleai-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
    scrape_interval: 30s
    scrape_timeout: 5s

  # BUS-302: бот экспортирует свой реестр prometheus_client на 9101
  # (start_http_server в app/bot/main.py). Сюда попадают llm-каунтеры
  # scheduler-гороскопов/forecast-ов — иначе OracleAILLMFailureRateHigh слеп.
  - job_name: oracleai-bot
    metrics_path: /metrics
    static_configs:
      - targets: ["bot:9101"]
    scrape_interval: 30s
    scrape_timeout: 5s

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # BUS-270: staging виден в том же Prometheus. Prometheus подключён к сети
  # oracle_staging_external (см. infra/docker-compose.yml prometheus.networks),
  # DNS-алиас staging-api существует в ней. Изоляция данных (схемы/БД) не
  # нарушается: это только скрейп /metrics, не общая сеть приложения.
  - job_name: oracleai-staging-api
    metrics_path: /metrics
    static_configs:
      - targets: ["staging-api:8080"]
    scrape_interval: 30s
    scrape_timeout: 5s

  # BUS-302: staging-бот, аналогично продовому. Порт 9101 не публикуется
  # наружу — скрейп только из сети oracle_staging_internal.
  - job_name: oracleai-staging-bot
    metrics_path: /metrics
    static_configs:
      - targets: ["staging-bot:9101"]
    scrape_interval: 30s
    scrape_timeout: 5s
