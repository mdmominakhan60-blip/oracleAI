global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: oracleai

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: oracleai-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
    scrape_interval: 30s
    scrape_timeout: 5s

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
