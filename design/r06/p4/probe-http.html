<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>p4 probe — вертикальная верификация 320px (iframe, same-origin)</title>
</head>
<body style="margin:0;font-family:system-ui;background:#0B0D18;color:#F4F2ED">

<div id="out" style="padding:8px;max-width:360px;font-size:12px;line-height:17px;white-space:pre-wrap"></div>

<div style="display:flex;flex-wrap:wrap;gap:8px;padding:8px">
  <iframe id="f1" src="index.html#view-chart-main" width="320" height="640" style="border:2px solid #E9C982;border-radius:8px"></iframe>
  <iframe id="f2" src="index.html#view-chart-interpret" width="320" height="640" style="border:2px solid #E9C982;border-radius:8px"></iframe>
  <iframe id="f3" src="index.html#view-chat-card" width="320" height="640" style="border:2px solid #E9C982;border-radius:8px"></iframe>
  <iframe id="f4" src="index.html#view-chart-empty" width="320" height="640" style="border:2px solid #E9C982;border-radius:8px"></iframe>
  <iframe id="f5" src="index.html#view-chart-loading" width="320" height="640" style="border:2px solid #E9C982;border-radius:8px"></iframe>
  <iframe id="f6" src="index.html#view-chart-zoom" width="320" height="640" style="border:2px solid #E9C982;border-radius:8px"></iframe>
  <iframe id="f7" src="index.html#view-chart-error" width="320" height="640" style="border:2px solid #E9C982;border-radius:8px"></iframe>
</div>

<script>
/* Проба: 7 видов в 320px-iframe (headless Chrome игнорирует
   --window-size <500, поэтому 320px только через same-origin
   iframe на http.server). Проверяет переполнения по
   scrollWidth > clientWidth на .screen-view.is-active. */
var out = document.getElementById('out');
var frames = Array.prototype.slice.call(document.querySelectorAll('iframe'));
var results = [];
var done = 0;

function label(f) {
  var h = f.src.split('#')[1] || 'no-hash';
  return h;
}

frames.forEach(function (f) {
  f.addEventListener('load', function () {
    setTimeout(check, 600);
  });
});

setTimeout(check, 2500);

function check() {
  if (done) return;
  done = 1;
  frames.forEach(function (f) {
    try {
      var doc = f.contentDocument;
      var active = doc.querySelector('.screen-view.is-active');
      if (!active) {
        results.push(label(f) + ': NO ACTIVE VIEW');
        return;
      }
      var over = [];
      doc.querySelectorAll('.screen-view.is-active *').forEach(function (el) {
        if (el.scrollWidth - el.clientWidth > 1 && !el.closest('svg')) {
          var tag = el.tagName.toLowerCase() + (el.className && typeof el.className === 'string' ? '.' + el.className.split(' ')[0] : '');
          over.push(tag + ':' + (el.scrollWidth - el.clientWidth));
        }
      });
      results.push(label(f) + ': ' + (over.length ? 'OVERFLOW ' + over.slice(0, 5).join(', ') : 'OK'));
    } catch (e) {
      results.push(label(f) + ': ERR ' + e.message);
    }
  });
  out.textContent = results.join('\n');
  document.title = results.every(function (r) { return /: OK$/.test(r); }) ? 'PROBE PASS' : 'PROBE FAIL';
  setTimeout(function () { document.title = 'done'; }, 50);
}
</script>
</body>
</html>
