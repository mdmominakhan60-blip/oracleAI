<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head><body style="margin:0">
<iframe id="f" style="width:320px;height:900px;border:0"></iframe>
<pre id="out">PENDING</pre>
<script>
const f = document.getElementById('f');
const out = document.getElementById('out');
const results = [];
f.onload = () => setTimeout(() => {
  const d = f.contentDocument;
  try {
    const q = d.getElementById('tarot-q');
    if (!q) throw new Error('no tarot-q');
    const ex = d.querySelectorAll('.tarot-examples__item')[0];
    if (!ex) throw new Error('no example item');
    const want = ex.dataset.q;
    ex.click();
    results.push('example-subst ok=' + (q.value === want));
    const drawBtn = d.getElementById('tarot-draw');
    if (!drawBtn) throw new Error('no draw btn');
    drawBtn.click();
    results.push('draw disabled=' + drawBtn.disabled);
    setTimeout(() => {
      try {
        const d2 = f.contentDocument;
        results.push('drawScene hidden=' + d2.getElementById('tarot-draw-scene').hidden +
                     ' revealBlock visible=' + !d2.getElementById('tarot-reveal-block').hidden);
        const cards = d2.querySelectorAll('#tarot-reveal-block .tcard');
        cards[2].querySelector('.tcard__frame').click();
        results.push('out-of-order card2 open=' + cards[2].classList.contains('is-open') +
                     ' warn-set=' + Boolean(cards[2].dataset.warn));
        cards[0].querySelector('.tcard__frame').click();
        results.push('in-order card0 open=' + cards[0].classList.contains('is-open') +
                     ' counter="' + d2.getElementById('tarot-counter').textContent + '"');
        d2.getElementById('tarot-show-all').click();
        results.push('showAll counter="' + d2.getElementById('tarot-counter').textContent + '"' +
                     ' all-open=' + Array.from(cards).every(c => c.classList.contains('is-open')));
        f.src = 'index.html?fail=1#view-tool-run';
        f.onload = () => setTimeout(() => {
          const d3 = f.contentDocument;
          const fail = d3.getElementById('run-fail-demo');
          results.push('failLayer visible=' + (fail ? !fail.hidden : 'noid'));
          out.textContent = 'RESULT ' + JSON.stringify(results, null, 1);
        }, 500);
      } catch (e) { out.textContent = 'RESULT ERR2 ' + String(e); }
    }, 900);
  } catch (e) { out.textContent = 'RESULT ERR ' + String(e); }
}, 700);
window.addEventListener('load', () => { f.src = 'index.html?x=1#view-tarot-question'; });
</script></body></html>
