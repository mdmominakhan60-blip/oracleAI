<!DOCTYPE html><html><body style="margin:0">
<iframe id="f" style="width:320px;height:900px;border:0"></iframe>
<pre id="out">PENDING</pre>
<script>
const base = 'http://127.0.0.1:8742/index.html';
const views = ['tool-quick','tool-form','tool-run','result','tarot-question','tarot-reveal','tarot-zoom','tarot-reading'];
const f = document.getElementById('f');
const out = document.getElementById('out');
let i = 0;
const results = [];
function next() {
  if (i >= views.length) { out.textContent = 'RESULT ' + JSON.stringify(results); return; }
  const v = views[i];
  f.src = base + '?v=' + i + '#view-' + v;
  f.onload = () => setTimeout(() => {
    try {
      const d = f.contentDocument;
      const de = d.documentElement;
      const wide = [];
      d.querySelectorAll('.screen-view.is-active *').forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.right > 320.5 && r.width > 0 && wide.length < 10) {
          wide.push(el.tagName + '.' + String(el.className).split(' ')[0] + ':' + Math.round(r.right));
        }
      });
      const active = d.querySelector('.screen-view.is-active');
      results.push({view: v, sw: de.scrollWidth, cw: de.clientWidth, overflow: de.scrollWidth > de.clientWidth, active: active ? active.id : 'none', wide});
    } catch (e) { results.push({view: v, error: String(e)}); }
    i++; next();
  }, 500);
}
window.addEventListener('load', () => { f.src = base; next(); });
</script>
</body></html>
